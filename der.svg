# 🐾 Clínica Veterinária Patinha Feliz

> Sistema de gestão para clínica veterinária desenvolvido em Python com interface gráfica (Tkinter) e banco de dados PostgreSQL.

---

## 📌 Descrição

O **Patinha Feliz** é um sistema de gestão veterinária que permite cadastrar tutores, animais e veterinários, além de registrar e acompanhar consultas. O sistema foi desenvolvido como trabalho acadêmico da disciplina de **Banco de Dados**, integrando conceitos de DDL, DML, DQL e conectividade com banco de dados relacional.

---

## 🛠️ Tecnologias Utilizadas

| Tecnologia | Uso |
|---|---|
| **Python 3.10+** | Linguagem principal |
| **Tkinter** | Interface gráfica (GUI) |
| **psycopg2** | Conector Python → PostgreSQL |
| **PostgreSQL 15+** | SGBD relacional |

---

## 🗃️ Modelagem do Banco de Dados

O sistema possui **4 tabelas** relacionadas:

```
tutores ──< animais ──< consultas >── veterinarios
```

| Tabela | Descrição |
|---|---|
| `tutores` | Donos/responsáveis pelos animais |
| `animais` | Pacientes da clínica (FK → tutores) |
| `veterinarios` | Profissionais da clínica |
| `consultas` | Atendimentos realizados (FK → animais, veterinarios) |

---

