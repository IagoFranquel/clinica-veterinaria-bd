## 🚀 Instruções de Execução

### 1. Pré-requisitos

- Python 3.10 ou superior instalado
- PostgreSQL 15 instalado e rodando
- pip atualizado

### 2. Configurar o Banco de Dados

```sql
-- No psql ou pgAdmin, crie o banco:
CREATE DATABASE clinica_vet;
```

Em seguida, execute os scripts na ordem:

```bash
psql -U postgres -d clinica_vet -f ddl/create_tables.sql
psql -U postgres -d clinica_vet -f dml/dados_exemplo.sql
```

### 3. Configurar a Aplicação

Abra o arquivo `src/app.py` e ajuste as configurações de conexão:

```python
DB_CONFIG = {
    "host":     "localhost",
    "port":     5432,
    "dbname":   "clinica_vet",
    "user":     "postgres",
    "password": "SUA_SENHA_AQUI",   # ← altere aqui
}
```

### 4. Instalar Dependências

```bash
pip install -r src/requirements.txt
```

### 5. Executar a Aplicação

```bash
python src/app.py
```

### 6. Login no Sistema

| Campo | Valor |
|---|---|
| Usuário | `admin` |
| Senha | `1234` |

