## 🔗 Funcionalidades

### ✅ CRUD Completo
- **Tutores**: Cadastro, edição, exclusão e listagem com busca
- **Animais**: Vinculados a tutores, com filtro e ordenação
- **Veterinários**: Com status ativo/inativo
- **Consultas**: Registro completo com diagnóstico e prescrição

### 🔍 Consultas com JOIN
- **INNER JOIN**: Consultas completas com dados de animal, tutor e veterinário
- **LEFT JOIN**: Animais com ou sem consultas registradas
- **Filtros**: Busca por texto e intervalo de datas
- **Ordenação**: Por qualquer coluna nas telas de listagem

### 💰 Relatórios
- Consultas completas (INNER JOIN de 4 tabelas)
- Animais sem consulta (LEFT JOIN)
- Faturamento por veterinário
- Filtro por período de datas

